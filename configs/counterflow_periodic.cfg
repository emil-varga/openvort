# Configuration for simple thermal counterflow in a periodic domain
# OpenVort Simulation Configuration

# Computational domain (x, y, z in cm)
# A cubic periodic domain of 0.1 cm x 0.1 cm x 0.1 cm
domain = ([-0.05, -0.05, -0.05], [0.05, 0.05, 0.05]);

# Boundary conditions
# periodic-6 corresponds to 6 periodic image tangles (1 in each direction)
boundaries = "periodic-6";

# Mutual friction parameters at T = 1.90 K
use_mutual_friction = true;
alpha = 0.206;
alpha_p = 0.00834;

# Initialization mode
init_mode = "random loops";
init_loops_n = 50;          # Start with 50 random loops in the domain

# General simulation properties
num_threads = 2;            # Number of OpenMP threads
dt = 0.0001;                # RK4 time step (seconds)
frame_shots = 10;           # Save frame every 10 steps

# Vortex line discretization (in cm)
dl_min = 0.001;             # Minimum segment length (10 um)
dl_max = 0.002;             # Maximum segment length (20 um)
small_loop_cutoff = 5;      # Remove loops with fewer than 5 points

# Reconnections setup
reconnection_distance = 0.002; # Max distance for reconnection (cm)
reconnection_angle_cutoff = 5.0; # Minimum angle in degrees

# Barnes-Hut tree-code approximation for Biot-Savart velocity
use_BH = true;
BH_resolution = 0.3;
BH_quadtree = false;
BH_grain = 0.0;

# External velocity configurations
# Constant counterflow with normal fluid carrying heat along +z and superfluid along -z
vn_conf = {
    type = "simple";
    external_v = [0.0, 0.0, 1.0]; # Normal fluid velocity (cm/s)
};

vs_conf = {
    type = "simple";
    external_v = [0.0, 0.0, -0.5]; # Superfluid velocity (cm/s)
};

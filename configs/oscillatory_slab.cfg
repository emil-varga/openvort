# Configuration for oscillatory flow in a 1 um slab with pinning walls on top and bottom
# OpenVort Simulation Configuration

# Computational domain (x, y, z in cm)
# Width and length are 0.02 cm (periodic), thickness (z) is 1 um = 1.0e-4 cm
domain = ([-0.01, -0.01, 0.0], [0.01, 0.01, 1.0e-4]);

# Boundary conditions
# wall-2-4 defines walls (mirror) at Z_L and Z_H, and periodic boundaries in x and y
boundaries = "wall-2-4";

# Enable pinning walls (vortices are pinned at the top and bottom solid boundaries)
# Options: "pin" or "slip"
wall_type = "pin";

# Mutual friction parameters at T = 1.65 K
use_mutual_friction = true;
alpha = 0.111;
alpha_p = 0.01437;

# Initialization mode
# Populate the slab with 5 pairs of straight lines spanning from bottom to top walls
init_mode = "random straight lines";
init_npairs = 5;
init_line_points = 20;

# General simulation properties
num_threads = 2;            # Number of OpenMP threads
dt = 5.0e-9;                # RK4 time step (seconds). Must be extremely small (nanoseconds) for stability with 0.1 um discretization!
frame_shots = 20000;        # Save frame every 20000 steps (every 0.1 ms of simulation time)

# Vortex line discretization (in cm)
# Scaled down to resolve dynamics in a 1 um slab
dl_min = 1.0e-5;            # Minimum segment length (0.1 um)
dl_max = 2.0e-5;            # Maximum segment length (0.2 um)
small_loop_cutoff = 5;      # Remove loops with fewer than 5 points

# Reconnections setup
reconnection_distance = 2.0e-5; # Max distance for reconnection (0.2 um)
reconnection_angle_cutoff = 5.0; # Minimum angle in degrees

# Barnes-Hut tree-code approximation for Biot-Savart velocity
use_BH = true;
BH_resolution = 0.3;
BH_quadtree = false;
BH_grain = 0.0;

# External velocity configurations
# Spatially uniform oscillatory flow along the x-axis with a frequency of 1000 Hz (1 kHz)
# wave = [0.0, 0.0, 0.0] removes spatial dependence (standing wave wavelength is infinite)
vn_conf = {
    type = "oscillating";
    strength = 2.0;                # Amplitude (cm/s)
    frequency = 1000.0;            # Frequency (Hz)
    wave = [0.0, 0.0, 0.0];        # Wavevector k (1/cm)
    polarization = [1.0, 0.0, 0.0]; # Unit vector of flow direction
};

vs_conf = {
    type = "oscillating";
    strength = -2.0;               # Amplitude (cm/s), opposite phase
    frequency = 1000.0;            # Frequency (Hz)
    wave = [0.0, 0.0, 0.0];        # Wavevector k (1/cm)
    polarization = [1.0, 0.0, 0.0]; # Unit vector of flow direction
};
